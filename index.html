<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- Sem maximum-scale/user-scalable: bloquear o zoom é uma barreira real para
       quem tem baixa visão, e o iOS já não aplica a restrição desde a versão 10. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Segue o tema do app (definido no boot script abaixo), não o do sistema. -->
  <meta name="theme-color" id="meta-theme-color" content="#FFF9EF" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <title>Eazy — Tranquilidade Financeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script>
    (function() {
      var pref
      try {
        // Cache gravado pelo App a cada troca de tema. As prefs_* sao apagadas
        // apos a migracao pro Firestore, entao sozinhas nao cobrem reloads.
        pref = localStorage.getItem('eazy_theme')
        if (!pref) {
          var uid = Object.keys(localStorage).find(function(k) { return k.startsWith('prefs_') })
          if (uid) pref = (JSON.parse(localStorage.getItem(uid)) || {}).theme
        }
      } catch (e) {}
      // Só 'light'/'dark' sao escolha explicita. 'system', ausente ou lixo segue o SO.
      var theme = (pref === 'dark' || pref === 'light') ? pref
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.setAttribute('data-theme', theme)
      document.getElementById('meta-theme-color')
        .setAttribute('content', theme === 'dark' ? '#111111' : '#FFF9EF')
    })()
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
