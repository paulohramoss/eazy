<body>
  <div id="root"></div>
  <script>
    (function() {
      var pref
      try {
        // Cache gravado pelo App a cada troca de tema. As prefs_* sao apagadas
        // apos a migracao pro Firestore, entao sozinhas nao cobrem reloads.
        pref = localStorage.getItem('eazy_theme')
        if (!pref) {
          var uid = Object.keys(localStorage).find(function(k) { return k.startsWith('prefs_') })
          if (uid) pref = (JSON.parse(localStorage.getItem(uid)) || {}).theme
        }
      } catch (e) {}
      // Só 'light'/'dark' sao escolha explicita. 'system', ausente ou lixo segue o SO.
      var theme = (pref === 'dark' || pref === 'light') ? pref
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.setAttribute('data-theme', theme)
      document.getElementById('meta-theme-color')
        .setAttribute('content', theme === 'dark' ? '#111111' : '#FFF9EF')
    })()
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
